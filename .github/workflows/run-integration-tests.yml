name: Run integration tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  run_integration_tests:
    name: Run ui's integration tests against Docker Compose environment
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'

      - name: Install dependencies && check that lockfile is up-to-date
        run: yarn --immutable

      - name: start e2e env
        uses: HSLdevcom/jore4-tools/github-actions/setup-e2e-environment@main
        with:
          tiamat_version: 'crjore4prod001.azurecr.io/jore4-tiamat:rebasing-2026-10-21-566c9fe787201ef3ea44c21bf0ce93080ad51754'

      - name: Build test db manager module
        run: yarn ws:db build

      - name: Run integration tests
        env:
          HASURA_URL: 'https://e2e.local.jore.hsldev.com/api/graphql/v1/graphql'
        run: yarn test:integration

# Access logs have no native level, so derive one from the response status.
map $status $log_level {
    ~^5     error;
    ~^4     warn;
    default info;
}

log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"level":"$log_level",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

# Skip logging of health check requests: Kubernetes probes and
# plain "GET /" requests sent without a User-Agent header.
map "$http_user_agent|$request_method $request_uri" $loggable {
    "~^kube-probe/" 0;
    "|GET /"        0;
    default         1;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name  localhost;

    access_log /var/log/nginx/access.log json_combined if=$loggable;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
